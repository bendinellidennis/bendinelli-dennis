name: Academy Pool Treatment REV06

on:
  push:
    branches:
      - academy-pool-treatment-rev06
    paths:
      - 'academy_pool_treatment/**'
      - '.github/workflows/academy-pool-treatment.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install reportlab pillow requests pypdf pymupdf
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - name: Build treatment module
        run: |
          python academy_pool_treatment/build.py
          mkdir -p academy_pool_treatment/render_it academy_pool_treatment/render_en
          pdftoppm -png -r 190 academy_pool_treatment/output/ACADEMY_DB_POOL_SYSTEMS_WATER_CHEMISTRY_DOSING_REV06_IT.pdf academy_pool_treatment/render_it/page >/dev/null 2>&1
          pdftoppm -png -r 190 academy_pool_treatment/output/ACADEMY_DB_POOL_SYSTEMS_WATER_CHEMISTRY_DOSING_REV06_EN.pdf academy_pool_treatment/render_en/page >/dev/null 2>&1
          python academy_pool_treatment/qa.py
          cd academy_pool_treatment/output
          zip -9 ACADEMY_DB_POOL_SYSTEMS_WATER_CHEMISTRY_DOSING_REV06_IT_EN.zip *.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: academy-pool-treatment-rev06
          path: |
            academy_pool_treatment/output/*
            academy_pool_treatment/render_it/*
            academy_pool_treatment/render_en/*
            academy_pool_treatment/qa_report.txt
          retention-days: 7
