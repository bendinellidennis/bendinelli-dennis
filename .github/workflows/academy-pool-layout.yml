name: Academy Pool Layout Penetrations REV09

on:
  push:
    branches:
      - academy-pool-layout-penetrations-rev09
    paths:
      - 'academy_pool_layout/**'
      - '.github/workflows/academy-pool-layout.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install reportlab pillow pypdf
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - name: Build layout and penetrations module
        run: |
          python academy_pool_layout/build.py
          mkdir -p academy_pool_layout/render_it academy_pool_layout/render_en
          pdftoppm -png -r 190 academy_pool_layout/output/ACADEMY_DB_POOL_SYSTEMS_LAYOUT_PENETRATIONS_REV09_IT.pdf academy_pool_layout/render_it/page >/dev/null 2>&1
          pdftoppm -png -r 190 academy_pool_layout/output/ACADEMY_DB_POOL_SYSTEMS_LAYOUT_PENETRATIONS_REV09_EN.pdf academy_pool_layout/render_en/page >/dev/null 2>&1
          python academy_pool_layout/qa.py
          cd academy_pool_layout/output
          zip -9 ACADEMY_DB_POOL_SYSTEMS_LAYOUT_PENETRATIONS_REV09_IT_EN.zip *.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: academy-pool-layout-penetrations-rev09
          path: |
            academy_pool_layout/output/*
            academy_pool_layout/render_it/*
            academy_pool_layout/render_en/*
            academy_pool_layout/qa_report.txt
          retention-days: 7
