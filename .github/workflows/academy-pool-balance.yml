name: Academy Pool Balance Tank REV04

on:
  push:
    branches:
      - academy-pool-balance-tank-rev04
    paths:
      - 'academy_pool_balance/**'
      - '.github/workflows/academy-pool-balance.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install reportlab pillow requests pypdf
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - name: Build balance tank module
        run: |
          python academy_pool_balance/build.py
          mkdir -p academy_pool_balance/render_it academy_pool_balance/render_en
          pdftoppm -png -r 180 academy_pool_balance/output/ACADEMY_DB_POOL_SYSTEMS_OVERFLOW_BALANCE_TANK_REV04_IT.pdf academy_pool_balance/render_it/page >/dev/null 2>&1
          pdftoppm -png -r 180 academy_pool_balance/output/ACADEMY_DB_POOL_SYSTEMS_OVERFLOW_BALANCE_TANK_REV04_EN.pdf academy_pool_balance/render_en/page >/dev/null 2>&1
          python academy_pool_balance/qa.py
          cd academy_pool_balance/output
          zip -9 ACADEMY_DB_POOL_SYSTEMS_OVERFLOW_BALANCE_TANK_REV04_IT_EN.zip *.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: academy-pool-balance-tank-rev04
          path: |
            academy_pool_balance/output/*
            academy_pool_balance/render_it/*
            academy_pool_balance/render_en/*
            academy_pool_balance/qa_report.txt
          retention-days: 7
