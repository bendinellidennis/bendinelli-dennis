name: Academy Pool HJ REV05

on:
  push:
    branches:
      - academy-pool-hj-rev05
    paths:
      - 'academy_pool_hj/**'
      - '.github/workflows/academy-pool-hj.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install reportlab pillow requests pypdf pymupdf
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - name: Build HJ module
        run: |
          python academy_pool_hj/build.py
          mkdir -p academy_pool_hj/render_it academy_pool_hj/render_en
          pdftoppm -png -r 180 academy_pool_hj/output/ACADEMY_DB_POOL_SYSTEMS_HYDROMASSAGE_VENTURI_REV05_IT.pdf academy_pool_hj/render_it/page >/dev/null 2>&1
          pdftoppm -png -r 180 academy_pool_hj/output/ACADEMY_DB_POOL_SYSTEMS_HYDROMASSAGE_VENTURI_REV05_EN.pdf academy_pool_hj/render_en/page >/dev/null 2>&1
          python academy_pool_hj/qa.py
          cd academy_pool_hj/output
          zip -9 ACADEMY_DB_POOL_SYSTEMS_HYDROMASSAGE_VENTURI_REV05_IT_EN.zip *.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: academy-pool-hj-rev05
          path: |
            academy_pool_hj/output/*
            academy_pool_hj/render_it/*
            academy_pool_hj/render_en/*
            academy_pool_hj/qa_report.txt
          retention-days: 7
